name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A200C1: ${{ secrets.A200C1 }}
          B2854F: ${{ secrets.B2854F }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A200C1', '')
          meta_b = os.environ.get('B2854F', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 5e2a3494850965c71d552920aa3e396723c45a -->', meta_a)
          if meta_b:
              out = out.replace('<!-- dca060c48ce3edd2bb6bfdbe06894374ef7cbe5dc987a0a9 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
